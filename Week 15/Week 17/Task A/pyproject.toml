[project]
name = "track-a-churn"
version = "0.1.0"
description = "Track A: Telco Churn MLOps"
requires-python = ">=3.11"
dependencies = [
    "mlflow>=2.16.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "evidently>=0.4.0",
    "xgboost>=2.1.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "jupyter>=1.0.0",
    "python-dotenv>=1.0.0",
    "seaborn>=0.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/track_a"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
