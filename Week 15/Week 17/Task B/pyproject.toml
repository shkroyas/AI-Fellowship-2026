[project]
name = "track-b-agentic"
version = "0.1.0"
description = "Track B: Agentic AI MLOps"
requires-python = ">=3.11"
dependencies = [
    "mlflow>=2.16.0",
    "openai>=1.50.0",
    "evidently>=0.7.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "ddgs>=7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/track_b"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
